    ArticleFilterDTO:
      type: object
      additionalProperties: false
      properties:
        tag:
          type: string
        author:
          type: string
        favorited:
          type: string
        limit:
          type: integer
          format: int32
          default: 20
        offset:
          type: integer
          format: int32
      required:
        - limit
        - offset

    FeedArticleFilterDTO:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          format: int32
          default: 20
        offset:
          type: integer
          format: int32
      required:
        - limit
        - offset

    Profile:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        bio:
          type: string
        image:
          type: string
        following:
          type: boolean
      required:
        - username
        - following
        - bio
        - image
